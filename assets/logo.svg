<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rueda exterior (anillo) -->
  <circle cx="50" cy="54" r="36" stroke="#00eaff" stroke-width="2" opacity="0.7" filter="url(#glow-cyan)"/>
  <!-- Marcas de la rueda -->
  <g stroke="#00eaff" stroke-width="1.5" opacity="0.5">
    <line x1="50" y1="18" x2="50" y2="24"/>
    <line x1="50" y1="84" x2="50" y2="90"/>
    <line x1="14" y1="54" x2="20" y2="54"/>
    <line x1="80" y1="54" x2="86" y2="54"/>
    <line x1="24.7" y1="29.4" x2="28.9" y2="33.7"/>
    <line x1="71.1" y1="74.3" x2="75.3" y2="78.6"/>
    <line x1="75.3" y1="29.4" x2="71.1" y2="33.7"/>
    <line x1="28.9" y1="74.3" x2="24.7" y2="78.6"/>
  </g>

  <!-- Cuerpo del candado -->
  <rect x="32" y="46" width="36" height="28" rx="4" fill="#121217" stroke="#00eaff" stroke-width="2" filter="url(#glow-cyan)"/>

  <!-- Arco del candado -->
  <path d="M37 46 V36 a13 13 0 0 1 26 0 V46" stroke="#ff33d4" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow-pink)"/>

  <!-- Ojo de cerradura -->
  <circle cx="50" cy="57" r="5" fill="#ff33d4" opacity="0.85" filter="url(#glow-pink)"/>
  <rect x="48" y="59" width="4" height="7" rx="2" fill="#ff33d4" opacity="0.85"/>

  <!-- Bits decorativos dentro del candado -->
  <text x="36" y="74" font-family="monospace" font-size="5" fill="#00eaff" opacity="0.4">101</text>
  <text x="57" y="74" font-family="monospace" font-size="5" fill="#00eaff" opacity="0.4">010</text>
</svg>
